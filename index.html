<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انتقادات و پیشنهادات بازی ESI KHERSI | اسی خرسی</title>

  <!-- فونت لاله‌زار و وزیرمتن -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">

  <!-- کتابخانه Supabase برای اتصال به دیتابیس بدون تحریم -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0e0c13;
      --card-bg: #181420;
      --card-inner: #221c2e;
      --border-color: #312842;
      --honey: #ffb703;
      --orange: #fb8500;
      --text: #ffffff;
      --text-muted: #a39eb2;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(251, 133, 0, 0.09) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(157, 78, 221, 0.08) 0%, transparent 45%);
      color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      padding: 24px 14px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .lalezar {
      font-family: 'Lalezar', cursive;
    }

    .container {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* هدر */
    .hero-box {
      background: linear-gradient(145deg, #221a30, #14101c);
      border: 2px solid var(--border-color);
      border-radius: var(--radius);
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .hero-box h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      color: var(--honey);
      text-shadow: 0 0 20px rgba(255, 183, 3, 0.4);
      margin-bottom: 8px;
    }

    .hero-box p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 580px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* فرم ارسال نظر */
    .form-box {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .form-title {
      font-size: 1.5rem;
      color: var(--honey);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-profile-badge {
      font-size: 0.85rem;
      background: rgba(255,255,255,0.08);
      padding: 4px 10px;
      border-radius: 20px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    input[type="text"], textarea {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--honey);
    }

    textarea {
      resize: vertical;
      min-height: 95px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Lalezar', cursive;
      font-size: 1.15rem;
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--honey), var(--orange));
      color: #120b02;
      flex: 1;
      min-width: 180px;
      box-shadow: 0 5px 15px rgba(251, 133, 0, 0.3);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(251, 133, 0, 0.45);
    }

    .btn-admin {
      background: transparent;
      border: 1px dashed var(--border-color);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-family: 'Vazirmatn', sans-serif;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-admin:hover {
      border-color: var(--honey);
      color: var(--honey);
    }

    /* کامنت‌ها */
    .comments-area {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .empty-state {
      background: var(--card-bg);
      border: 2px dashed var(--border-color);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state span {
      font-size: 3rem;
      display: block;
      margin-bottom: 10px;
    }

    .comment-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 18px;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .comment-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--card-inner);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      border: 1px solid var(--border-color);
    }

    .user-name {
      font-weight: 700;
      color: #fff;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .comment-date {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .comment-text {
      color: #dedede;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-line;
    }

    .comment-actions {
      margin-top: 10px;
      display: flex;
      gap: 12px;
    }

    .reply-btn {
      color: var(--honey);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .replies-container {
      margin-top: 12px;
      padding-right: 18px;
      border-right: 2px solid var(--honey);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reply-card {
      background: var(--card-inner);
      border-radius: 12px;
      padding: 12px;
    }

    .admin-badge {
      background: linear-gradient(135deg, var(--honey), var(--orange));
      color: #1a0f00;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .reply-input-box {
      margin-top: 10px;
      display: none;
      gap: 8px;
    }

    .reply-input-box.open {
      display: flex;
    }

    /* پیام تشکر خرسولی */
    .toast-bear {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #ffb703, #fb8500);
      color: #120b02;
      padding: 14px 24px;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(251, 133, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Lalezar', cursive;
      font-size: 1.3rem;
      z-index: 1000;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .toast-bear.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    footer {
      margin-top: 35px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    footer .brand {
      color: #fff;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="hero-box">
      <h1 class="lalezar">بازی اسی خرسی (ESI KHERSI) 🐾</h1>
      <p>هرگونه پیشنهاد، باگ یا انتقادی داری بنویس. همه نظرات به دست سازنده بازی می‌رسه و همین‌جا پاسخ داده می‌شه!</p>
      
      <div style="margin-top: 16px;">
        <button class="btn-admin" onclick="toggleAdminMode()" id="adminToggleBtn">
          🔑 ورود سازنده (ادمین)
        </button>
      </div>
    </div>

    <!-- فرم ارسال نظر -->
    <div class="form-box">
      <div class="form-title lalezar">
        <span>ثبت نظر جدید</span>
        <span class="user-profile-badge" id="currentUserBadge">حالت: مهمان 🐻</span>
      </div>

      <div class="input-group">
        <input type="text" id="authorInput" placeholder="نام یا لقب شما (مثال: خرس تک‌تیرانداز)">
      </div>

      <div class="input-group">
        <textarea id="contentInput" placeholder="انتقاد یا پیشنهادت رو بنویس..."></textarea>
      </div>

      <div class="btn-row">
        <button class="btn btn-submit" id="submitBtn" onclick="submitComment()">
          <span>ارسال نظر خرسولی</span>
          <span>🐾</span>
        </button>
      </div>
    </div>

    <!-- لیست نظرات آنلاین -->
    <h2 class="lalezar" style="color: var(--honey); font-size: 1.6rem; margin-top: 10px;">
      نظرات خرسولیا (<span id="commentCount">0</span>)
    </h2>

    <div class="comments-area" id="commentsList">
      <div class="empty-state">
        <span>⏳</span>
        <p>در حال دریافت جدیدترین نظرات از سرور...</p>
      </div>
    </div>

    <!-- فوتر اختصاصی شما -->
    <footer>
      ساخته شده با عشق توسط <span class="brand">NightVex</span> 💜🤎
    </footer>

  </div>

  <!-- توست پیام تشکر -->
  <div class="toast-bear" id="thanksToast">
    <span>🐻</span>
    <span>خیلی ممنون از نظرت خرسولی عزیز!</span>
    <span>❤️</span>
  </div>

  <script>
    /* -------------------------------------------------------------
       تنظیمات دیتابیس Supabase (بدون تحریم برای ایران)
       کافیست دو مقدار زیر را از پنل Supabase خود در اینجا قرار دهید:
    ------------------------------------------------------------- */
    const SUPABASE_URL = "https://nadpcfsfluneiqrvozyx.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_5dlDZZo_XAXt9l5WZDMDkg__tRjwl8f";

    // ساخت اتصال به دیتابیس
    const client = (SUPABASE_URL.includes("YOUR_PROJECT_ID")) 
      ? null 
      : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isAdmin = false;

    // توست تشکر
    function showToast() {
      const toast = document.getElementById('thanksToast');
      toast.classList.add('active');
      setTimeout(() => {
        toast.classList.remove('active');
      }, 4200);
    }

    // دریافت نظرات به صورت آنلاین
    async function loadComments() {
      const list = document.getElementById('commentsList');
      const count = document.getElementById('commentCount');

      if (!client) {
        list.innerHTML = `
          <div class="empty-state" style="border-color: #ff0054;">
            <span>⚠️</span>
            <p class="lalezar" style="color: #ff0054; font-size: 1.3rem;">دیتابیس هنوز متصل نشده است!</p>
            <p>لطفاً طبق ۳ مرحله‌ی راهنما، کلیدهای رایگان Supabase را داخل کد قرار دهید تا پیام‌ها به دست شما برسند.</p>
          </div>
        `;
        return;
      }

      // دریافت از دیتابیس آنلاین
      const { data, error } = await client
        .from('comments')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        list.innerHTML = `<div class="empty-state"><p>خطا در برقراری ارتباط با سرور: ${error.message}</p></div>`;
        return;
      }

      // دسته‌بندی نظرات اصلی و ریپلای‌ها
      const mainComments = data.filter(c => !c.parent_id);
      const replies = data.filter(c => c.parent_id);
      count.innerText = mainComments.length;

      if (mainComments.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <span>🐾</span>
            <p class="lalezar" style="font-size: 1.3rem; color: var(--honey); margin-bottom: 6px;">هنوز هیچ نظری ثبت نشده است!</p>
            <p>اولین خرسولی باش که نظر یا پیشنهادت رو برای بازی ثبت می‌کنی ✨</p>
          </div>
        `;
        return;
      }

      list.innerHTML = '';

      mainComments.forEach((c) => {
        const card = document.createElement('div');
        card.className = 'comment-card';

        // ریپلای‌های مربوط به این نظر
        const commentReplies = replies.filter(r => r.parent_id === c.id);
        let repliesHtml = '';
        
        if (commentReplies.length > 0) {
          repliesHtml = '<div class="replies-container">';
          commentReplies.forEach(r => {
            repliesHtml += `
              <div class="reply-card">
                <div class="comment-header">
                  <div class="comment-user">
                    <div class="user-avatar">${r.is_admin ? '👑' : '🐾'}</div>
                    <span class="user-name">
                      ${r.author} 
                      ${r.is_admin ? '<span class="admin-badge">سازنده بازی</span>' : ''}
                    </span>
                  </div>
                  <span class="comment-date">${new Date(r.created_at).toLocaleDateString('fa-IR')}</span>
                </div>
                <div class="comment-text">${r.text}</div>
              </div>
            `;
          });
          repliesHtml += '</div>';
        }

        card.innerHTML = `
          <div class="comment-header">
            <div class="comment-user">
              <div class="user-avatar">${c.is_admin ? '👑' : '🐻'}</div>
              <span class="user-name">
                ${c.author}
                ${c.is_admin ? '<span class="admin-badge">سازنده بازی</span>' : ''}
              </span>
            </div>
            <span class="comment-date">${new Date(c.created_at).toLocaleDateString('fa-IR')}</span>
          </div>
          <div class="comment-text">${c.text}</div>
          
          <div class="comment-actions">
            <button class="reply-btn" onclick="toggleReplyBox(${c.id})">
              💬 پاسخ به این نظر
            </button>
          </div>

          <div class="reply-input-box" id="reply-box-${c.id}">
            <input type="text" id="reply-input-${c.id}" placeholder="پاسخ شما به این نظر...">
            <button class="btn btn-submit" style="min-width: 90px; padding: 6px 14px;" onclick="submitReply(${c.id})">ارسال</button>
          </div>

          ${repliesHtml}
        `;

        list.appendChild(card);
      });
    }

    // ارسال نظر جدید به سرور
    async function submitComment() {
      const authorInput = document.getElementById('authorInput');
      const contentInput = document.getElementById('contentInput');
      const submitBtn = document.getElementById('submitBtn');

      const name = authorInput.value.trim() || "خرسولی ناشناس";
      const text = contentInput.value.trim();

      if (!text) {
        alert("لطفاً متن نظرت رو بنویس خرسولی عزیز!");
        return;
      }

      if (!client) {
        alert("ابتدا کلیدهای Supabase را قرار دهید.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "در حال ارسال...";

      const { error } = await client.from('comments').insert([
        {
          author: isAdmin ? "سازنده بازی ESI KHERSI" : name,
          text: text,
          is_admin: isAdmin,
          parent_id: null
        }
      ]);

      submitBtn.disabled = false;
      submitBtn.innerHTML = `<span>ارسال نظر خرسولی</span><span>🐾</span>`;

      if (error) {
        alert("خطا در ارسال نظر: " + error.message);
      } else {
        contentInput.value = '';
        authorInput.value = '';
        showToast();
        loadComments();
      }
    }

    // باز کردن کادر ریپلای
    function toggleReplyBox(id) {
      const box = document.getElementById(`reply-box-${id}`);
      box.classList.toggle('open');
    }

    // ارسال ریپلای به سرور
    async function submitReply(parentId) {
      const input = document.getElementById(`reply-input-${parentId}`);
      const text = input.value.trim();

      if (!text) return;
      if (!client) return;

      const { error } = await client.from('comments').insert([
        {
          author: isAdmin ? "سازنده بازی ESI KHERSI" : "یک خرسولی",
          text: text,
          is_admin: isAdmin,
          parent_id: parentId
        }
      ]);

      if (error) {
        alert("خطا در ارسال پاسخ: " + error.message);
      } else {
        input.value = '';
        toggleReplyBox(parentId);
        showToast();
        loadComments();
      }
    }

    // ورود سازنده بازی
    function toggleAdminMode() {
      if (isAdmin) {
        isAdmin = false;
        document.getElementById('adminToggleBtn').innerText = "🔑 ورود سازنده (ادمین)";
        document.getElementById('currentUserBadge').innerText = "حالت: مهمان 🐻";
        alert("از حالت ادمین خارج شدید.");
      } else {
        const pass = prompt("رمز ورود سازنده بازی را وارد کنید:");
        if (pass === "esi") {
          isAdmin = true;
          document.getElementById('adminToggleBtn').innerText = "👑 ادمین فعال است (خروج)";
          document.getElementById('currentUserBadge').innerText = "حالت: سازنده بازی ESI KHERSI 👑";
          alert("خوش آمدید NightVex عزیز! تمام پاسخ‌های شما با تگ طلایی سازنده بازی ثبت خواهد شد.");
        } else if (pass !== null) {
          alert("رمز اشتباه بود!");
        }
      }
    }

    // لود کامنت‌ها در ابتدا
    loadComments();

    // گوش دادن زنده (Realtime) به نظرات جدید
    if (client) {
      client.channel('public:comments')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, () => {
          loadComments();
        })
        .subscribe();
    }
  </script>
</body>
</html>
